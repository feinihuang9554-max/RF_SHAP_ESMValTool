[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-shap"
version = "0.1.0"
description = "Cube-native tree-ensemble and SHAP diagnosis for ESM–observation relationships"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Feini Huang", email = "feini.huang@uv.es" },
]
maintainers = [
  { name = "Feini Huang", email = "feini.huang@uv.es" },
]
keywords = [
  "climate",
  "CMIP",
  "ESMValTool",
  "SHAP",
  "ExtraTrees",
  "XAI",
  "Earth system model",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
models = ["xgboost>=1.7", "lightgbm>=4.0"]
explain = ["shap>=0.44"]
fastshap = ["fasttreeshap>=0.1.3"]
dev = ["pytest>=7.0"]
all = ["xgboost>=1.7", "lightgbm>=4.0", "shap>=0.44", "fasttreeshap>=0.1.3", "pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/feinihuang9554-max/RF_SHAP_ESMValTool"
Repository = "https://github.com/feinihuang9554-max/RF_SHAP_ESMValTool"
Issues = "https://github.com/feinihuang9554-max/RF_SHAP_ESMValTool/issues"
"ESMValTool PR" = "https://github.com/ESMValGroup/ESMValTool/pull/4658"

[project.scripts]
rf-shap = "rf_shap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rf_shap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
