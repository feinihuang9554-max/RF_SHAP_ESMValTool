[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-shap"
version = "0.1.0"
description = "CMIP6-like model vs observation diagnosis with tree models and SHAP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
models = ["xgboost>=1.7", "lightgbm>=4.0"]
explain = ["shap>=0.44"]
fastshap = ["fasttreeshap>=0.1.3"]
dev = ["pytest>=7.0"]
all = ["xgboost>=1.7", "lightgbm>=4.0", "shap>=0.44", "fasttreeshap>=0.1.3", "pytest>=7.0"]

[project.scripts]
rf-shap = "rf_shap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
