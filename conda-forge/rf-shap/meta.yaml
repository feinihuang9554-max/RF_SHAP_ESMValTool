{# Draft conda-forge recipe. Submit to conda-forge/staged-recipes AFTER the
   matching version is on PyPI: https://pypi.org/project/rf-shap/ #}
{% set name = "rf-shap" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/rf_shap-{{ version }}.tar.gz
  # sha256: fill after `twine upload` / download from PyPI
  sha256: REPLACE_AFTER_PYPI_RELEASE

build:
  noarch: python
  number: 0
  entry_points:
    - rf-shap = rf_shap.cli:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.9
    - numpy >=1.23
    - pandas >=1.5
    - xarray >=2023.1
    - netcdf4 >=1.6
    - scikit-learn >=1.3
    - scipy >=1.10
    - pyyaml >=6.0
    - matplotlib-base >=3.7
    # optional: shap, fasttreeshap, xgboost, lightgbm

test:
  imports:
    - rf_shap
  commands:
    - pip check
    - rf-shap --help
  requires:
    - pip

about:
  home: https://github.com/feinihuang9554-max/RF_SHAP_ESMValTool
  summary: Cube-native tree-ensemble and SHAP diagnosis for ESM–observation relationships
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/feinihuang9554-max/RF_SHAP_ESMValTool
  dev_url: https://github.com/feinihuang9554-max/RF_SHAP_ESMValTool

extra:
  recipe-maintainers:
    - feinihuang9554-max
