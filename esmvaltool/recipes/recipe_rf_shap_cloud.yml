# CMOR cloud-cover case: ACCESS-ESM1-5 clt judged against ERA5 clt + drivers.
#
#   python esmvaltool/prepare_obs6_cloud.py \
#     --src /path/to/esm_case_data/obs --dst /path/to/esm_case_data/obs6
#   # tas/hurs/rsds must already exist from prepare_obs6_gpp.py
#   esmvaltool run esmvaltool/recipes/recipe_rf_shap_cloud.yml
#
# Predictors are fields present on both ACCESS-ESM1-5 and ERA5
# (tas, hurs, rsds). ERA5 500 hPa vertical velocity is not used: there is
# no matching CMIP wap file in the local archive.
---
documentation:
  title: Random-forest and SHAP diagnosis of CMIP6 total cloud cover versus ERA5
  description: |
    Learn clt = f(tas, hurs, rsds) on a 1° grid using ExtraTrees.
    The judged mapping is ACCESS-ESM1-5 historical. The reference mapping is
    ERA5 total cloud cover with ERA5 drivers (OBS6 clt from prepare_obs6_cloud.py).
  authors:
    - andela_bouwe
  maintainer:
    - schlund_manuel
  references:
    - acknow_project
  projects:
    - esmval

datasets:
  - dataset: ACCESS-ESM1-5
    project: CMIP6
    exp: historical
    ensemble: r1i1p1f1
    grid: gn
    institute: CSIRO

preprocessors:
  rf_shap_cube:
    regrid:
      target_grid: 1x1
      scheme: linear

diagnostics:
  rf_shap:
    description: CMIP total cloud cover mapping compared with ERA5
    themes:
      - phys
    realms:
      - atmos
    variables:
      clt:
        mip: Amon
        preprocessor: rf_shap_cube
        timerange: "1980/2014"
        additional_datasets:
          - &era5
            dataset: ERA5
            project: OBS6
            type: reanaly
            version: 1
            tier: 3
      tas:
        mip: Amon
        preprocessor: rf_shap_cube
        timerange: "1980/2014"
        additional_datasets:
          - *era5
      hurs:
        mip: Amon
        preprocessor: rf_shap_cube
        timerange: "1980/2014"
        additional_datasets:
          - *era5
      rsds:
        mip: Amon
        preprocessor: rf_shap_cube
        timerange: "1980/2014"
        additional_datasets:
          - *era5
    scripts:
      rf_shap:
        script: rf_shap/diagnostic.py
        target: clt
        predictors:
          - tas
          - hurs
          - rsds
        predictor_dataset: ACCESS-ESM1-5
        target_dataset: ACCESS-ESM1-5
        caption: ACCESS-ESM1-5 total cloud cover compared with ERA5.
        reference:
          predictor_dataset: ERA5
          target_dataset: ERA5
          n_bins: 20
          interaction: false
        rf_shap:
          seed: 42
          feature_selection:
            methods: []
          x_transform:
            mode: raw
          split:
            method: time
            test_size: 0.2
          sampling:
            method: random
            n_samples: 8000
          model:
            name: extra_trees
            params:
              n_estimators: 120
              max_depth: 12
              n_jobs: -1
          explain:
            shap:
              enabled: true
              method: auto
              max_samples: 1500
